<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../src/styles/profile.css"/>
    <link rel="stylesheet" href="../src/styles/main.css"/>
  </head>
  <body>

    <div class="title-bar">
      <h1>Berko Litter Pick</h1>
      <div class="map-page-button"><a href="./index.html"></a></div>
    </div>
    <script type="module" src="../src/profilePage/profile.js"></script>
  </body>

  <template id="login-form-template">
    <div class="profile-login-menu">
      <div class="profile-login-header">
        <div class="profile-login-title">Sign in</div>
        <div class="profile-login-subtitle">or register a new account</div>
      </div>
      <div class="profile-login-fields">
        <div class="login-field">
          <label class="login-label" for="username-input">Username</label>
          <input class="login-input" id="username-input" autocomplete="username" />
        </div>
        <div class="login-field">
          <label class="login-label" for="password-input">Password</label>
          <input class="login-input" id="password-input" type="password" autocomplete="current-password" />
        </div>
      </div>
      <div class="button-holder">
        <button class="login-button">Login</button>
        <button class="register-button">Register</button>
      </div>
    </div>
  </template>

  <template id="profile-template">
    <div class="profile-menu">
      <div class="profile-info">
        <div class="user-name"></div>
        <div class="user-areas"></div>
      </div>
      <div class="button-holder">
        <button class="logout-button">Log out</button>
      </div>
    </div>
  </template>


</html>
