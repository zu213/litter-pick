<html>
  <head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../src/styles/main.css"/>
  </head>
  <body>

    <div class="title-bar">
      <h1>Berko Litter Pick</h1>
      <div class="profile-page-button"><a href="./profile.html"></a></div>
    </div>
    <div class="loading">
      <div class="loading-spinner"></div>
      <span class="loading-text">Loading map...</span>
    </div>
    <div class="map-layout">
      <div class='map-container' id="map"></div>
    </div>
    <script type="module" src="../src/mapPage/main.js"></script>
  </body>

  <template id="login-template">
    <div class="login-mask">
      <div class="login-menu">
        <div class="login-menu-header">
          <div class="login-menu-title">Sign in</div>
          <div class="login-menu-subtitle">Enter your details to continue</div>
        </div>
        <div class="login-menu-fields">
          <div class="login-field">
            <label class="login-label" for="login-username">Username</label>
            <input class="login-menu-username--input login-input" placeholder="your username" autocomplete="username" id="login-username" />
          </div>
          <div class="login-field">
            <label class="login-label" for="login-password">Password</label>
            <input class="login-menu-password--input login-input" type="password" placeholder="••••••••" autocomplete="current-password" id="login-password" />
          </div>
          <div class="login-error"></div>
        </div>
        <button class="login-menu-button">Sign in</button>
      </div>
    </div>
  </template>

  <template id="sidebar-template">
    <div id="area-cards" class="area-cards-holder">
    </div>
  </template>

  <template id="detailed-card-template">
    <div class="detailed-card-mask">
      <div class="detailed-card">
        <div class="detailed-card-loading">Loading...</div>
        <div class="detailed-card-content" style="display:none">
          <div id="area-title"></div>
          <div id="area-volunteers"></div>
          <div id="area-last-picked"></div>
          <div class="button-container"></div>
        </div>
      </div>
    </div>
  </template>

</html>
